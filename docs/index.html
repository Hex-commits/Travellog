<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Travel log</title>
  <meta name="description" content="Travel photos placed on a map, one album per journey.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%232c4a94' stroke='%23ffffff' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="assets/site.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module" src="assets/js/main.js"></script>
</head>
<body>
  <div class="page">
    <header class="report-header">
      <div class="report-heading">
        <p class="eyebrow">Travel log</p>
        <div class="album-switcher" id="album-switcher">
          <h1 class="report-title">
            <button class="album-switcher-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="album-menu" data-album-button>
              <span data-album-name>Loading…</span>
              <svg class="album-switcher-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </h1>
          <ul class="album-menu" id="album-menu" aria-label="Albums" data-album-menu hidden></ul>
        </div>
        <p class="report-dates" id="trip-dates">Loading photos…</p>
      </div>
      <div class="report-figures">
        <dl class="trip-stats">
          <div><dt>Photos</dt><dd id="stat-photos">–</dd></div>
          <div><dt>Days</dt><dd id="stat-days">–</dd></div>
        </dl>
        <p class="report-note" id="updated-at"></p>
      </div>
    </header>

    <main class="explorer">
      <section class="map-panel" aria-label="Map of photo locations">
        <div id="map" class="map"></div>
      </section>
      <aside class="album-panel" aria-label="Photo album">
        <div class="album-tabs" id="album-tabs" role="tablist" aria-label="Order of the photos">
          <button class="album-tab" type="button" role="tab" aria-controls="album" aria-selected="true" data-album-order="date">By date</button>
          <button class="album-tab" type="button" role="tab" aria-controls="album" aria-selected="false" data-album-order="place">By place</button>
        </div>
        <div id="album" class="album" role="tabpanel"></div>
      </aside>
    </main>

  </div>

  <dialog id="lightbox" class="lightbox" aria-label="Photo viewer">
    <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close photo">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="lightbox-step lightbox-previous" type="button" data-lightbox-step="-1" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <figure class="lightbox-figure" data-lightbox-figure>
      <img data-lightbox-image alt="">
      <figcaption class="lightbox-details">
        <div class="lightbox-map-frame" data-lightbox-map-frame>
          <div class="lightbox-map" data-lightbox-map></div>
          <p class="lightbox-map-empty">No location recorded</p>
        </div>
        <div class="lightbox-text">
          <p class="lightbox-date" data-lightbox-date></p>
          <p class="lightbox-area" data-lightbox-area></p>
          <p class="lightbox-data"><span data-lightbox-coordinates></span><span data-lightbox-counter></span></p>
          <button class="lightbox-show-on-map" type="button" data-lightbox-close>Show on map</button>
        </div>
      </figcaption>
    </figure>
    <button class="lightbox-step lightbox-next" type="button" data-lightbox-step="1" aria-label="Next photo">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </dialog>
</body>
</html>
